services:
  - type: web
    name: maduk-bi-frontend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r frontend/requirements.txt
    startCommand: streamlit run frontend/App.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: BACKEND_API_HOSTPORT
        fromService:
          type: web
          name: maduk-bi-backend
          property: hostport

  - type: web
    name: maduk-bi-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: FRONTEND_URL 
        sync: false 
      - key: DATABASE_URL
        fromDatabase:
          name: maduk-bi-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_HASH
        sync: false
      - key: SMTP_SERVER
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: maduk-bi-postgres
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
